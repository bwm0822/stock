<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高端疫苗 KGI 即時</title>
</head>
<body>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --surface:      #fcfcfb;
    --plane:        #f9f9f7;
    --ink:          #0b0b0b;
    --ink-2:        #52514e;
    --muted:        #898781;
    --grid:         #e1e0d9;
    --baseline:     #c3c2b7;
    --border:       rgba(11,11,11,0.10);
    --accent:       #2a78d6;
    --up:           #b3392f;
    --down:         #0c7a3d;
    --neutral:      #898781;
    --chip-bg:      #f1efe9;
    --good:         #0ca30c;
    --critical:     #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface:      #1a1a19;
      --plane:        #0d0d0d;
      --ink:          #ffffff;
      --ink-2:        #c3c2b7;
      --muted:        #898781;
      --grid:         #2c2c2a;
      --baseline:     #383835;
      --border:       rgba(255,255,255,0.10);
      --accent:       #3987e5;
      --up:           #e8756a;
      --down:         #3dbb72;
      --neutral:      #898781;
      --chip-bg:      #232321;
      --good:         #0ca30c;
      --critical:     #e66767;
    }
  }
  :root[data-theme="dark"] {
    --surface:      #1a1a19;
    --plane:        #0d0d0d;
    --ink:          #ffffff;
    --ink-2:        #c3c2b7;
    --muted:        #898781;
    --grid:         #2c2c2a;
    --baseline:     #383835;
    --border:       rgba(255,255,255,0.10);
    --accent:       #3987e5;
    --up:           #e8756a;
    --down:         #3dbb72;
    --neutral:      #898781;
    --chip-bg:      #232321;
    --good:         #0ca30c;
    --critical:     #e66767;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--plane);
    color: var(--ink);
    font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    padding-inline: 16px;
    padding-block: 28px 48px;
    display: flex;
    justify-content: center;
  }
  .page { width: 100%; max-width: 780px; display: flex; flex-direction: column; gap: 18px; }

  header.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .id-block { display: flex; align-items: baseline; gap: 10px; }
  h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted); background: var(--chip-bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 5px; }

  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.live .dot { background: var(--good); box-shadow: 0 0 0 0 rgba(12,163,12,0.5); animation: pulse 1.6s infinite; }
  .status.offline .dot { background: var(--critical); }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(12,163,12,0.45); }
    70%  { box-shadow: 0 0 0 6px rgba(12,163,12,0); }
    100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); }
  }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .panel-head h2 { font-size: 13px; font-weight: 800; margin: 0; }
  .panel-head .hint { font-size: 11.5px; color: var(--muted); font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .chart-wrap { position: relative; padding: 14px 16px 6px; }
  svg.chart { display: block; width: 100%; max-width: 100%; height: auto; overflow: visible; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .axis-label { fill: var(--muted); font-size: 10px; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .panel-label { fill: var(--muted); font-size: 10px; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .wick { stroke-width: 1; }
  .prevclose-line { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.6; }
  .crosshair-x { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
  .hover-col { fill: var(--ink); opacity: 0; }
  .empty { padding: 40px 18px; text-align: center; color: var(--muted); font-size: 13px; }

  .tooltip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.08s;
    background: var(--ink); color: var(--surface); border-radius: 9px; padding: 9px 11px;
    font-size: 12px; line-height: 1.55; white-space: nowrap; transform: translate(-50%, calc(-100% - 14px));
    box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    z-index: 5;
  }
  .tooltip .t-date { font-weight: 700; margin-bottom: 3px; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 14px; }
  .tooltip .t-row span:last-child { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  footer.note { font-size: 11.5px; color: var(--muted); }

  .table-scroll { max-height: 340px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0; background: var(--surface); text-align: right; font-weight: 700;
    color: var(--ink-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 9px 16px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  thead th:first-child, tbody td:first-child { text-align: left; }
  tbody td {
    padding: 6px 16px; text-align: right; border-bottom: 1px solid var(--grid);
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  tbody tr:hover { background: var(--chip-bg); }
  td.time-cell { font-family: 'Manrope', sans-serif; font-weight: 600; }
  td.up { color: var(--up); }
  td.down { color: var(--down); }
  td.empty-row { text-align: center; color: var(--muted); font-family: 'Manrope', sans-serif; padding: 24px; }
</style>

<div class="page">

  <header class="head">
    <div class="id-block">
      <h1>高端疫苗</h1>
      <span class="code">6547</span>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">連線中…</span></div>
  </header>

  <div class="panel">
    <div class="panel-head">
      <h2>即時走勢(逐筆)</h2>
      <span class="hint" id="tickHint"></span>
    </div>
    <div class="chart-wrap" id="tickChartWrap">
      <div class="empty">等待資料…</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>成交明細</h2>
      <span class="hint" id="tradeHint"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>時間</th><th>成交價</th><th>漲跌</th><th>單量</th></tr>
        </thead>
        <tbody id="tradeBody"><tr><td colspan="4" class="empty-row">等待資料…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>5分K棒</h2>
      <span class="hint" id="kbarHint"></span>
    </div>
    <div class="chart-wrap" id="kbarChartWrap">
      <div class="empty">等待資料…</div>
    </div>
  </div>

  <footer class="note">
    資料來源:凱基證券 KGI SUPER PY quoteapi 即時推播 · 由 Stream-KGIQuote.py 寫入 output/6547_kgi_tick.json 與 output/6547_kgi_5min.json · 台股慣例:紅漲綠跌
  </footer>

</div>

<script>
(function () {
  'use strict';

  var POLL_MS = 2000;
  var NS = 'http://www.w3.org/2000/svg';
  var consecutiveFailures = 0;

  function fmt(n, digits) {
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  function fmtInt(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    return Math.round(n).toLocaleString('en-US');
  }
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function dirColorVar(open, close) {
    if (close > open) return 'var(--up)';
    if (close < open) return 'var(--down)';
    return 'var(--neutral)';
  }
  function clampedTooltipLeft(tooltip, desiredLeft, containerWidth) {
    var margin = 6;
    var half = (tooltip.offsetWidth || 130) / 2;
    var min = margin + half, max = containerWidth - margin - half;
    if (max < min) return containerWidth / 2;
    return Math.max(min, Math.min(max, desiredLeft));
  }
  function timeLabel(dt) {
    // datetime strings look like yyyyMMddHHmm or yyyyMMddHHmmss
    var s = String(dt);
    var hh = s.slice(-6, -4) || s.slice(-4, -2);
    var mm = s.slice(-4, -2) === hh ? s.slice(-2) : s.slice(-4, -2);
    if (s.length >= 12) return s.slice(8, 10) + ':' + s.slice(10, 12);
    return s;
  }

  function todayYmd() {
    var d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  }

  // Defensive client-side guard: regardless of what the JSON file actually
  // contains (stale data left over from a previous run, a file from a
  // different day, etc.), only ever show today's points, sorted by time.
  function keepTodaySorted(list, field) {
    if (!list) return [];
    var today = todayYmd();
    return list
      .filter(function (item) { return String(item[field]).slice(0, 8) === today; })
      .sort(function (a, b) { return String(a[field]).localeCompare(String(b[field])); });
  }

  function renderTickChart(ticks) {
    var wrap = document.getElementById('tickChartWrap');
    if (!ticks || ticks.length < 2) {
      wrap.innerHTML = '<div class="empty">還在累積逐筆資料…(需要至少2筆)</div>';
      return;
    }
    wrap.innerHTML = '<svg class="chart" id="tickSvg" viewBox="0 0 720 200" preserveAspectRatio="none"></svg><div class="tooltip" id="tickTip"></div>';
    var svg = document.getElementById('tickSvg');
    var W = 720, H = 200, padL = 46, padR = 8, padT = 8, padB = 22;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var prices = ticks.map(function (t) { return t.price; }).filter(function (p) { return p !== null && p !== undefined; });
    var yMax = Math.max.apply(null, prices), yMin = Math.min.apply(null, prices);
    var pad = (yMax - yMin) * 0.12 || Math.max(0.05, yMax * 0.005);
    yMax += pad; yMin -= pad;

    function x(i) { return padL + (ticks.length === 1 ? plotW / 2 : (i / (ticks.length - 1)) * plotW); }
    function y(v) { return padT + (1 - (v - yMin) / (yMax - yMin)) * plotH; }

    var steps = 4;
    for (var s = 0; s <= steps; s++) {
      var v = yMin + (yMax - yMin) * (s / steps), yy = y(v);
      svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: yy, y2: yy, class: 'gridline' }));
      var t = el('text', { x: padL - 8, y: yy + 3.5, 'text-anchor': 'end', class: 'axis-label' });
      t.textContent = v.toFixed(2);
      svg.appendChild(t);
    }
    svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: padT + plotH, y2: padT + plotH, class: 'baseline' }));

    var labelCount = Math.min(6, ticks.length);
    for (var li = 0; li < labelCount; li++) {
      var idx = Math.round((li / Math.max(1, labelCount - 1)) * (ticks.length - 1));
      var t2 = el('text', {
        x: x(idx), y: H - 6,
        'text-anchor': li === 0 ? 'start' : (li === labelCount - 1 ? 'end' : 'middle'),
        class: 'axis-label'
      });
      t2.textContent = timeLabel(ticks[idx].time);
      svg.appendChild(t2);
    }

    var pts = ticks.map(function (t, i) { return x(i) + ',' + y(t.price); });
    svg.appendChild(el('path', {
      d: 'M ' + pts.join(' L '), fill: 'none',
      style: 'stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round'
    }));
    var lastX = x(ticks.length - 1), lastY = y(ticks[ticks.length - 1].price);
    svg.appendChild(el('circle', { cx: lastX, cy: lastY, r: 4, style: 'fill:var(--accent);stroke:var(--surface);stroke-width:2' }));

    var crosshair = el('line', { x1: padL, x2: padL, y1: padT, y2: padT + plotH, class: 'crosshair-x' });
    svg.appendChild(crosshair);
    var catcher = el('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent' });
    svg.appendChild(catcher);
    var tooltip = document.getElementById('tickTip');

    function onMove(evt) {
      var rect = svg.getBoundingClientRect();
      var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      var relX = (clientX - rect.left) / rect.width * W;
      var idx2 = Math.round(((relX - padL) / plotW) * (ticks.length - 1));
      idx2 = Math.max(0, Math.min(ticks.length - 1, idx2));
      var tk = ticks[idx2], px = x(idx2);
      crosshair.setAttribute('x1', px); crosshair.setAttribute('x2', px); crosshair.style.opacity = 1;
      tooltip.style.opacity = 1;
      tooltip.innerHTML =
        '<div class="t-date">' + timeLabel(tk.time) + '</div>' +
        '<div class="t-row"><span>成交</span><span>' + fmt(tk.price, 2) + '</span></div>' +
        '<div class="t-row"><span>單量</span><span>' + fmtInt(tk.volume) + '</span></div>';
      tooltip.style.left = clampedTooltipLeft(tooltip, (px / W) * rect.width, rect.width) + 'px';
      tooltip.style.top = ((y(tk.price) / H) * rect.height) + 'px';
    }
    function onLeave() { crosshair.style.opacity = 0; tooltip.style.opacity = 0; }
    catcher.onmousemove = onMove;
    catcher.onmouseleave = onLeave;
    catcher.ontouchmove = function (e) { onMove(e); e.preventDefault(); };
    catcher.ontouchend = onLeave;
  }

  function renderKbarChart(bars) {
    var wrap = document.getElementById('kbarChartWrap');
    if (!bars || bars.length < 1) {
      wrap.innerHTML = '<div class="empty">還在等待第一根K棒形成…</div>';
      return;
    }
    wrap.innerHTML = '<svg class="chart" id="kbarSvg" viewBox="0 0 720 240" preserveAspectRatio="none"></svg><div class="tooltip" id="kbarTip"></div>';
    var svg = document.getElementById('kbarSvg');
    var W = 720, padL = 46, padR = 8;
    var priceTop = 8, priceH = 170, volGap = 10, volH = 44;
    var volTop = priceTop + priceH + volGap, volBottom = volTop + volH, labelY = volBottom + 20;
    var plotW = W - padL - padR;

    var highs = bars.map(function (b) { return b.high; });
    var lows = bars.map(function (b) { return b.low; });
    var yMax = Math.max.apply(null, highs), yMin = Math.min.apply(null, lows);
    var pad = (yMax - yMin) * 0.1 || Math.max(0.05, yMax * 0.005);
    yMax += pad; yMin -= pad;
    var volMax = Math.max.apply(null, bars.map(function (b) { return b.volume || 0; })) || 1;

    var slotW = plotW / bars.length;
    var bodyW = Math.max(1, Math.min(slotW * 0.62, 12));

    function x(i) { return padL + (i + 0.5) * slotW; }
    function yPrice(v) { return priceTop + (1 - (v - yMin) / (yMax - yMin)) * priceH; }
    function yVol(v) { return volBottom - (v / volMax) * volH; }

    for (var s = 0; s <= 4; s++) {
      var v = yMin + (yMax - yMin) * (s / 4), yy = yPrice(v);
      svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: yy, y2: yy, class: 'gridline' }));
      var t = el('text', { x: padL - 8, y: yy + 3.5, 'text-anchor': 'end', class: 'axis-label' });
      t.textContent = v.toFixed(2);
      svg.appendChild(t);
    }
    svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: priceTop + priceH, y2: priceTop + priceH, class: 'baseline' }));
    svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: volBottom, y2: volBottom, class: 'baseline' }));
    var volLbl = el('text', { x: W - padR, y: volTop + 3.5, 'text-anchor': 'end', class: 'panel-label' });
    volLbl.textContent = '成交量';
    svg.appendChild(volLbl);

    var labelCount = Math.min(6, bars.length);
    for (var li = 0; li < labelCount; li++) {
      var idx = Math.round((li / Math.max(1, labelCount - 1)) * (bars.length - 1));
      var t2 = el('text', {
        x: x(idx), y: labelY,
        'text-anchor': li === 0 ? 'start' : (li === labelCount - 1 ? 'end' : 'middle'),
        class: 'axis-label'
      });
      t2.textContent = timeLabel(bars[idx].datetime);
      svg.appendChild(t2);
    }

    for (var i = 0; i < bars.length; i++) {
      var b = bars[i], cx = x(i), color = dirColorVar(b.open, b.close);
      svg.appendChild(el('line', { x1: cx, x2: cx, y1: yPrice(b.high), y2: yPrice(b.low), class: 'wick', style: 'stroke:' + color }));
      var bodyTop = yPrice(Math.max(b.open, b.close));
      var bodyH = Math.max(1, Math.abs(yPrice(b.open) - yPrice(b.close)));
      svg.appendChild(el('rect', { x: cx - bodyW / 2, y: bodyTop, width: bodyW, height: bodyH, style: 'fill:' + color }));
      var vH = volBottom - yVol(b.volume || 0);
      svg.appendChild(el('rect', { x: cx - bodyW / 2, y: yVol(b.volume || 0), width: bodyW, height: Math.max(0.5, vH), style: 'fill:' + color, opacity: 0.75 }));
    }

    var crosshair = el('line', { x1: padL, x2: padL, y1: priceTop, y2: volBottom, class: 'crosshair-x' });
    svg.appendChild(crosshair);
    var hoverCol = el('rect', { x: 0, y: priceTop, width: slotW, height: volBottom - priceTop, class: 'hover-col' });
    svg.appendChild(hoverCol);
    var catcher = el('rect', { x: 0, y: 0, width: W, height: volBottom, fill: 'transparent' });
    svg.appendChild(catcher);
    var tooltip = document.getElementById('kbarTip');

    function onMove(evt) {
      var rect = svg.getBoundingClientRect();
      var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      var relX = (clientX - rect.left) / rect.width * W;
      var idx2 = Math.floor((relX - padL) / slotW);
      idx2 = Math.max(0, Math.min(bars.length - 1, idx2));
      var b = bars[idx2], px = x(idx2);
      crosshair.setAttribute('x1', px); crosshair.setAttribute('x2', px); crosshair.style.opacity = 1;
      hoverCol.setAttribute('x', px - slotW / 2); hoverCol.setAttribute('width', slotW); hoverCol.style.opacity = 0.06;
      tooltip.style.opacity = 1;
      tooltip.innerHTML =
        '<div class="t-date">' + timeLabel(b.datetime) + '</div>' +
        '<div class="t-row"><span>開</span><span>' + fmt(b.open, 2) + '</span></div>' +
        '<div class="t-row"><span>高</span><span>' + fmt(b.high, 2) + '</span></div>' +
        '<div class="t-row"><span>低</span><span>' + fmt(b.low, 2) + '</span></div>' +
        '<div class="t-row"><span>收</span><span>' + fmt(b.close, 2) + '</span></div>' +
        '<div class="t-row"><span>量</span><span>' + fmtInt(b.volume) + '</span></div>';
      tooltip.style.left = clampedTooltipLeft(tooltip, (px / W) * rect.width, rect.width) + 'px';
      tooltip.style.top = ((priceTop / 240) * rect.height) + 'px';
    }
    function onLeave() { crosshair.style.opacity = 0; hoverCol.style.opacity = 0; tooltip.style.opacity = 0; }
    catcher.onmousemove = onMove;
    catcher.onmouseleave = onLeave;
    catcher.ontouchmove = function (e) { onMove(e); e.preventDefault(); };
    catcher.ontouchend = onLeave;
  }

  function renderTradeTable(ticks) {
    var body = document.getElementById('tradeBody');
    var container = body.closest('.table-scroll');

    // If scrolled to (near) the top, keep following the newest row - leave
    // it alone, the natural post-render scrollTop is already 0. Otherwise,
    // remember exactly which row (by its time key) sits at the top edge of
    // the visible area, and how far scrolled past it, so it can be restored
    // after re-render - regardless of how many new rows get prepended above
    // it or how tall rows actually are.
    var anchorKey = null, anchorOffset = 0;
    if (container && container.scrollTop >= 4) {
      var containerRect = container.getBoundingClientRect();
      var oldRows = body.querySelectorAll('tr[data-key]');
      for (var r = 0; r < oldRows.length; r++) {
        var offset = oldRows[r].getBoundingClientRect().top - containerRect.top;
        if (offset >= 0) {
          anchorKey = oldRows[r].getAttribute('data-key');
          anchorOffset = offset;
          break;
        }
      }
    }

    if (!ticks || ticks.length === 0) {
      body.innerHTML = '<tr><td colspan="4" class="empty-row">還沒有今天的成交資料</td></tr>';
      return;
    }

    var html = '';
    // newest first
    for (var i = ticks.length - 1; i >= 0; i--) {
      var t = ticks[i];
      var prev = ticks[i - 1];
      var chg = prev ? t.price - prev.price : null;
      var dir = chg > 0 ? 'up' : (chg < 0 ? 'down' : '');
      var chgText = chg === null ? '—' : (chg > 0 ? '+' : '') + chg.toFixed(2);
      html += '<tr data-key="' + t.time + '">' +
        '<td class="time-cell">' + timeLabel(t.time) + '</td>' +
        '<td>' + fmt(t.price, 2) + '</td>' +
        '<td class="' + dir + '">' + chgText + '</td>' +
        '<td>' + fmtInt(t.volume) + '</td>' +
        '</tr>';
    }
    body.innerHTML = html;

    if (container && anchorKey !== null) {
      var newAnchor = body.querySelector('tr[data-key="' + anchorKey + '"]');
      if (newAnchor) {
        var newContainerRect = container.getBoundingClientRect();
        var newOffset = newAnchor.getBoundingClientRect().top - newContainerRect.top;
        container.scrollTop += (newOffset - anchorOffset);
      }
    }
  }

  function setStatus(ok, text) {
    var status = document.getElementById('status');
    var statusText = document.getElementById('statusText');
    status.className = 'status ' + (ok ? 'live' : 'offline');
    statusText.textContent = text;
  }

  // Archive files (output/..._0.json, _1.json, ...) never change once
  // written, so they're fetched once each and cached here instead of being
  // re-fetched every poll - only newly-appeared archives (per the manifest's
  // count) get fetched on a given poll.
  var archiveCache = {
    tick: { count: 0, items: [] },
    kbar: { count: 0, items: [] }
  };

  function loadNewArchives(kind, basePath, field) {
    var cache = archiveCache[kind];
    return fetch(basePath + '_manifest.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : { count: 0 }; })
      .then(function (manifest) {
        var count = manifest.count || 0;
        if (count <= cache.count) return cache.items;
        var fetches = [];
        for (var i = cache.count; i < count; i++) {
          fetches.push(
            fetch(basePath + '_' + i + '.json', { cache: 'no-store' })
              .then(function (r) { return r.ok ? r.json() : null; })
          );
        }
        return Promise.all(fetches).then(function (results) {
          results.forEach(function (r) {
            if (r && r[field]) cache.items = cache.items.concat(r[field]);
          });
          cache.count = count;
          return cache.items;
        });
      })
      .catch(function () { return cache.items; });
  }

  function poll() {
    Promise.all([
      fetch('output/6547_kgi_tick.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }),
      fetch('output/6547_kgi_5min.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }),
      loadNewArchives('tick', 'output/6547_kgi_tick', 'ticks'),
      loadNewArchives('kbar', 'output/6547_kgi_5min', 'bars')
    ]).then(function (results) {
      var tickData = results[0], kbarData = results[1];
      var tickArchive = results[2], kbarArchive = results[3];
      if (!tickData && !kbarData) throw new Error('兩個檔案都讀不到');
      consecutiveFailures = 0;
      setStatus(true, '即時');

      if (tickData) {
        var allTicks = tickArchive.concat(tickData.ticks || []);
        var todaysTicks = keepTodaySorted(allTicks, 'time');
        renderTickChart(todaysTicks);
        renderTradeTable(todaysTicks);
        document.getElementById('tickHint').textContent =
          '今日 ' + todaysTicks.length + ' 筆 · 更新於 ' + tickData.updatedAt;
        document.getElementById('tradeHint').textContent = '共 ' + todaysTicks.length + ' 筆(最新在上)';
      }
      if (kbarData) {
        var allBars = kbarArchive.concat(kbarData.bars || []);
        var todaysBars = keepTodaySorted(allBars, 'datetime');
        renderKbarChart(todaysBars);
        document.getElementById('kbarHint').textContent =
          (kbarData.minutes || '') + '分K · 今日 ' + todaysBars.length + ' 根 · 更新於 ' + kbarData.updatedAt;
      }
    }).catch(function (err) {
      consecutiveFailures++;
      setStatus(false, '離線');
      var msg = '<div class="empty">讀取不到即時資料。請先執行:<br>' +
        '<code style="font-family:\'IBM Plex Mono\',monospace">.\\Stream-KGIQuote.py --stock 6547</code><br>' +
        '並保持該視窗持續運行。<br><span style="color:var(--muted)">(' + err.message + ')</span></div>';
      document.getElementById('tickChartWrap').innerHTML = msg;
      document.getElementById('kbarChartWrap').innerHTML = msg;
    });
  }

  poll();
  setInterval(poll, POLL_MS);
})();
</script>

</body>
</html>
