<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高端疫苗 6547</title>
</head>
<body>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --surface:      #fcfcfb;
    --plane:        #f9f9f7;
    --ink:          #0b0b0b;
    --ink-2:        #52514e;
    --muted:        #898781;
    --grid:         #e1e0d9;
    --baseline:     #c3c2b7;
    --border:       rgba(11,11,11,0.10);
    --accent:       #2a78d6;
    --up:           #b3392f;   /* TW convention: red = price up */
    --down:         #0c7a3d;   /* TW convention: green = price down */
    --neutral:      #898781;
    --chip-bg:      #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface:      #1a1a19;
      --plane:        #0d0d0d;
      --ink:          #ffffff;
      --ink-2:        #c3c2b7;
      --muted:        #898781;
      --grid:         #2c2c2a;
      --baseline:     #383835;
      --border:       rgba(255,255,255,0.10);
      --accent:       #3987e5;
      --up:           #e8756a;
      --down:         #3dbb72;
      --neutral:      #898781;
      --chip-bg:      #232321;
    }
  }
  :root[data-theme="dark"] {
    --surface:      #1a1a19;
    --plane:        #0d0d0d;
    --ink:          #ffffff;
    --ink-2:        #c3c2b7;
    --muted:        #898781;
    --grid:         #2c2c2a;
    --baseline:     #383835;
    --border:       rgba(255,255,255,0.10);
    --accent:       #3987e5;
    --up:           #e8756a;
    --down:         #3dbb72;
    --neutral:      #898781;
    --chip-bg:      #232321;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--plane);
    color: var(--ink);
    font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    padding-inline: 16px;
    padding-block: 28px 48px;
    display: flex;
    justify-content: center;
  }
  .page { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 22px; }

  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }

  header.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 20px; }
  .id-block { display: flex; align-items: baseline; gap: 10px; }
  .code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: var(--muted); background: var(--chip-bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 5px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .market-tag { font-size: 12px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .stat { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 19px; font-weight: 700; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .stat .value.up { color: var(--up); }
  .stat .value.down { color: var(--down); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }

  .range-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .range-row .hint { font-size: 12px; color: var(--muted); }
  .range-buttons { display: flex; gap: 4px; }
  .range-buttons button {
    font-family: inherit; font-size: 12px; font-weight: 700; color: var(--ink-2);
    background: transparent; border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 11px; cursor: pointer;
  }
  .range-buttons button:hover { background: var(--chip-bg); }
  .range-buttons button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .chart-wrap { position: relative; padding: 16px 16px 6px; }
  svg.chart { display: block; width: 100%; max-width: 100%; height: auto; overflow: visible; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .panel-label { fill: var(--muted); font-size: 10px; font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.04em; }
  .axis-label { fill: var(--muted); font-size: 10.5px; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .wick { stroke-width: 1; }
  .last-close-line { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.7; }
  .last-close-label { fill: var(--accent); font-size: 10px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; }
  .level-line { stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.55; }
  .level-line.up { stroke: var(--up); }
  .level-line.down { stroke: var(--down); }
  .level-label { font-size: 9px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; }
  .level-label.up { fill: var(--up); }
  .level-label.down { fill: var(--down); }
  .crosshair-x { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
  .hover-col { fill: var(--ink); opacity: 0; }

  .tooltip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.08s;
    background: var(--ink); color: var(--surface); border-radius: 9px; padding: 9px 11px;
    font-size: 12px; line-height: 1.55; white-space: nowrap; transform: translate(-50%, calc(-100% - 14px));
    box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    z-index: 5;
  }
  .tooltip .t-date { font-weight: 700; margin-bottom: 3px; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 14px; }
  .tooltip .t-row span:last-child { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .legend { display: flex; align-items: center; gap: 16px; padding: 0 16px 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .swatch.line { width: 14px; height: 2px; border-radius: 2px; }

  .table-scroll { max-height: 480px; overflow: auto; border-top: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 640px; }
  thead th {
    position: sticky; top: 0; background: var(--surface); text-align: right; font-weight: 700;
    color: var(--ink-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  thead th:first-child, tbody td:first-child { text-align: left; }
  tbody td { padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--grid); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--chip-bg); }
  td.date-cell { font-family: 'Manrope', sans-serif; font-weight: 600; }
  td.up { color: var(--up); }
  td.down { color: var(--down); }

  footer.note { font-size: 11.5px; color: var(--muted); padding: 2px 2px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(11,11,11,0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.12s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal-panel {
    background: var(--surface); border-radius: 16px; border: 1px solid var(--border);
    width: 100%; max-width: 620px; max-height: 88vh;
    overflow-x: hidden; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { font-size: 15px; margin: 0; font-weight: 800; }
  .modal-close {
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    width: 28px; height: 28px; cursor: pointer; color: var(--ink-2); font-size: 15px; line-height: 1;
  }
  .modal-close:hover { background: var(--chip-bg); }
  .modal-stats { display: flex; gap: 8px 16px; padding: 12px 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); border-bottom: 1px solid var(--border); }
  .modal-stats b { font-family: 'IBM Plex Mono', ui-monospace, monospace; color: var(--ink); font-weight: 700; }
  .modal-stats .up b, .modal-stats.up b { color: var(--up); }
  .modal-stats .down b, .modal-stats.down b { color: var(--down); }
  .modal-chart-wrap { position: relative; padding: 14px 16px 6px; }
  .modal-empty { padding: 40px 18px; text-align: center; color: var(--muted); font-size: 13px; }

  @media (max-width: 480px) {
    .range-row { flex-direction: column; align-items: stretch; }
    .range-buttons { justify-content: space-between; }
    .range-buttons button { flex: 1; }
  }
</style>

<div class="page">

  <header class="head">
    <div class="id-block">
      <h1>高端疫苗</h1>
      <span class="code">6547</span>
    </div>
    <span class="market-tag">上櫃(TPEx) · 日K</span>
  </header>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="range-row">
      <div class="hint" id="rangeHint">載入中…</div>
      <div class="range-buttons" id="rangeButtons" role="group" aria-label="時間區間">
        <button data-range="30">1個月</button>
        <button data-range="90">3個月</button>
        <button data-range="180">6個月</button>
        <button data-range="365">1年</button>
        <button data-range="0">全部</button>
      </div>
    </div>

    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 880 300" preserveAspectRatio="none" role="img" aria-label="K線圖含成交量,顯示開高低收與每日成交量">
        <g id="gridGroup"></g>
        <line id="lastCloseLine" class="last-close-line" x1="0" x2="0" y1="0" y2="0"></line>
        <text id="lastCloseLabel" class="last-close-label"></text>
        <g id="candles"></g>
        <g id="volumeBars"></g>
        <g id="xLabels"></g>
        <g id="yLabels"></g>
        <g id="volLabels"></g>
        <rect id="hoverCol" class="hover-col" y="0" width="1" height="1"></rect>
        <line id="crosshair" class="crosshair-x" x1="0" y1="0" x2="0" y2="0"></line>
        <rect id="hoverCatcher" x="0" y="0" width="880" height="300" fill="transparent"></rect>
      </svg>
      <div class="tooltip" id="tooltip"></div>
    </div>

    <div class="legend">
      <span class="item"><span class="swatch" style="background:var(--up)"></span>收紅(收盤&gt;開盤)</span>
      <span class="item"><span class="swatch" style="background:var(--down)"></span>收黑(收盤&lt;開盤)</span>
      <span class="item"><span class="swatch line" style="background:var(--accent)"></span>最新收盤參考線</span>
      <span class="item">影線 = 最高 / 最低價;下方色柱 = 成交量</span>
    </div>
  </div>

  <div class="panel">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>開盤價</th>
            <th>最高價</th>
            <th>最低價</th>
            <th>收盤價</th>
            <th>漲跌幅</th>
            <th>最低振幅%</th>
            <th>最高振幅%</th>
            <th>總振幅%</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <footer class="note">
    資料來源:凱基證券 API(日K)· output/6547_daily.csv · 台股慣例:紅漲綠跌 · 點擊表格任一列可看當日分鐘走勢
  </footer>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">當日走勢</h2>
      <button class="modal-close" id="modalClose" aria-label="關閉" type="button">✕</button>
    </div>
    <div class="modal-stats" id="modalStats"></div>
    <div class="modal-chart-wrap" id="modalChartWrap">
      <svg class="chart" id="dayChart" viewBox="0 0 560 220" preserveAspectRatio="none" role="img" aria-label="當日分鐘走勢圖"></svg>
      <div class="tooltip" id="dayTooltip"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var state = { rows: [], rangeDays: 30 };

  function fmt(n, digits) {
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    return n.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  function fmtInt(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    return Math.round(n).toLocaleString('en-US');
  }
  function pct(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    var s = n > 0 ? '+' : '';
    return s + n.toFixed(2) + '%';
  }
  function signClass(n) {
    if (n > 0) return 'up';
    if (n < 0) return 'down';
    return '';
  }
  function dirColorVar(open, close) {
    if (close > open) return 'var(--up)';
    if (close < open) return 'var(--down)';
    return 'var(--neutral)';
  }

  // Parses the FULL 54-column KGI daily-K export (output/6547_daily.csv) by
  // header name, so it keeps working unchanged if KGI reorders/adds columns.
  function parseCSV(text) {
    function clean(s) { return s.replace(/^"|"$/g, ''); }
    var lines = text.trim().split(/\r?\n/);
    var headers = lines[0].split(',').map(clean);
    function colIndex(name) {
      var idx = headers.indexOf(name);
      if (idx === -1) throw new Error('找不到欄位: ' + name);
      return idx;
    }
    var iDate = colIndex('日期'), iOpen = colIndex('開盤價'), iHigh = colIndex('最高價'),
        iLow = colIndex('最低價'), iClose = colIndex('收盤價'),
        iChange = colIndex('漲跌幅(%)'), iVolume = colIndex('成交量');

    var out = [];
    for (var i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      var parts = lines[i].split(',').map(clean);
      var open = parseFloat(parts[iOpen]);
      var high = parseFloat(parts[iHigh]);
      var low = parseFloat(parts[iLow]);
      var close = parseFloat(parts[iClose]);
      var changePct = parseFloat(parts[iChange]);
      var volume = parseFloat(parts[iVolume]);
      out.push({
        date: parts[iDate],
        open: open, high: high, low: low, close: close,
        changePct: changePct, volume: volume,
        lowAmp: open ? (low - open) / open * 100 : NaN,
        highAmp: open ? (high - open) / open * 100 : NaN,
        totalAmp: open ? (high - low) / open * 100 : NaN
      });
    }
    return out;
  }

  function filteredRows() {
    var rows = state.rows;
    if (!state.rangeDays) return rows;
    var lastDate = new Date(rows[rows.length - 1].date);
    var cutoff = new Date(lastDate);
    cutoff.setDate(cutoff.getDate() - state.rangeDays);
    return rows.filter(function (r) { return new Date(r.date) >= cutoff; });
  }

  function renderStats(rows) {
    var last = rows[rows.length - 1];
    var first = rows[0];
    var periodChange = first.open ? (last.close - first.open) / first.open * 100 : NaN;
    var high = Math.max.apply(null, rows.map(function (r) { return r.high; }));
    var low = Math.min.apply(null, rows.map(function (r) { return r.low; }));
    var avgVol = rows.reduce(function (s, r) { return s + (r.volume || 0); }, 0) / rows.length;

    var el = document.getElementById('stats');
    el.innerHTML =
      '<div class="stat"><span class="label">最新收盤(' + last.date + ')</span>' +
        '<span class="value">' + fmt(last.close, 1) + '</span></div>' +
      '<div class="stat"><span class="label">當日漲跌幅</span>' +
        '<span class="value ' + signClass(last.changePct) + '">' + pct(last.changePct) + '</span></div>' +
      '<div class="stat"><span class="label">區間漲跌</span>' +
        '<span class="value ' + signClass(periodChange) + '">' + pct(periodChange) + '</span></div>' +
      '<div class="stat"><span class="label">區間最高</span><span class="value">' + fmt(high, 1) + '</span></div>' +
      '<div class="stat"><span class="label">區間最低</span><span class="value">' + fmt(low, 1) + '</span></div>' +
      '<div class="stat"><span class="label">區間均量(張)</span><span class="value">' + fmtInt(avgVol) + '</span></div>';
  }

  function renderTable(rows) {
    var body = document.getElementById('tableBody');
    var html = '';
    for (var i = rows.length - 1; i >= 0; i--) {
      var r = rows[i];
      html += '<tr data-date="' + r.date + '" title="查看 ' + r.date + ' 分鐘走勢">' +
        '<td class="date-cell">' + r.date + '</td>' +
        '<td>' + fmt(r.open, 1) + '</td>' +
        '<td>' + fmt(r.high, 1) + '</td>' +
        '<td>' + fmt(r.low, 1) + '</td>' +
        '<td>' + fmt(r.close, 1) + '</td>' +
        '<td class="' + signClass(r.changePct) + '">' + pct(r.changePct) + '</td>' +
        '<td class="' + signClass(r.lowAmp) + '">' + pct(r.lowAmp) + '</td>' +
        '<td class="' + signClass(r.highAmp) + '">' + pct(r.highAmp) + '</td>' +
        '<td>' + pct(r.totalAmp) + '</td>' +
        '</tr>';
    }
    body.innerHTML = html;
  }

  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // Tooltip is horizontally centered on `desiredLeft` via translate(-50%, ...),
  // so near either edge of `containerWidth` it can get clipped by an
  // overflow:hidden ancestor. Clamp the center point so the box always stays
  // fully inside [margin, containerWidth - margin].
  function clampedTooltipLeft(tooltip, desiredLeft, containerWidth) {
    var margin = 6;
    var half = (tooltip.offsetWidth || 140) / 2;
    var min = margin + half;
    var max = containerWidth - margin - half;
    if (max < min) return containerWidth / 2;
    return Math.max(min, Math.min(max, desiredLeft));
  }

  function renderChart(rows) {
    var W = 880, padL = 46, padR = 8;
    var priceTop = 8, priceH = 196;
    var volGap = 12, volH = 60;
    var volTop = priceTop + priceH + volGap;
    var volBottom = volTop + volH;
    var labelY = volBottom + 22;
    var plotW = W - padL - padR;

    var highs = rows.map(function (r) { return r.high; });
    var lows = rows.map(function (r) { return r.low; });
    var yMax = Math.max.apply(null, highs);
    var yMin = Math.min.apply(null, lows);
    var pad = (yMax - yMin) * 0.08 || 1;
    yMax += pad; yMin -= pad;
    var volMax = Math.max.apply(null, rows.map(function (r) { return r.volume || 0; })) || 1;

    var slotW = plotW / rows.length;
    var bodyW = Math.max(1, Math.min(slotW * 0.62, 10));

    function x(i) { return padL + (i + 0.5) * slotW; }
    function yPrice(v) { return priceTop + (1 - (v - yMin) / (yMax - yMin)) * priceH; }
    function yVol(v) { return volBottom - (v / volMax) * volH; }

    // grid + y labels (price panel)
    var gridGroup = document.getElementById('gridGroup');
    var yLabels = document.getElementById('yLabels');
    var volLabels = document.getElementById('volLabels');
    gridGroup.innerHTML = ''; yLabels.innerHTML = ''; volLabels.innerHTML = '';

    var steps = 4;
    for (var s = 0; s <= steps; s++) {
      var v = yMin + (yMax - yMin) * (s / steps);
      var yy = yPrice(v);
      gridGroup.appendChild(el('line', { x1: padL, x2: W - padR, y1: yy, y2: yy, class: 'gridline' }));
      var txt = el('text', { x: padL - 8, y: yy + 3.5, 'text-anchor': 'end', class: 'axis-label' });
      txt.textContent = v.toFixed(1);
      yLabels.appendChild(txt);
    }
    gridGroup.appendChild(el('line', { x1: padL, x2: W - padR, y1: priceTop + priceH, y2: priceTop + priceH, class: 'baseline' }));

    // volume panel top label + baseline
    var volLabelTop = el('text', { x: padL - 8, y: volTop + 3.5, 'text-anchor': 'end', class: 'axis-label' });
    volLabelTop.textContent = fmtInt(volMax);
    volLabels.appendChild(volLabelTop);
    var volLabelBase = el('text', { x: padL - 8, y: volBottom + 3.5, 'text-anchor': 'end', class: 'axis-label' });
    volLabelBase.textContent = '0';
    volLabels.appendChild(volLabelBase);
    gridGroup.appendChild(el('line', { x1: padL, x2: W - padR, y1: volBottom, y2: volBottom, class: 'baseline' }));
    var panelTag = el('text', { x: W - padR, y: volTop + 3.5, 'text-anchor': 'end', class: 'panel-label' });
    panelTag.textContent = '成交量(張)';
    volLabels.appendChild(panelTag);

    // x labels (sparse)
    var xLabelsG = document.getElementById('xLabels');
    xLabelsG.innerHTML = '';
    var labelCount = Math.min(7, rows.length);
    for (var li = 0; li < labelCount; li++) {
      var idx = Math.round((li / Math.max(1, labelCount - 1)) * (rows.length - 1));
      var txt2 = el('text', {
        x: x(idx), y: labelY,
        'text-anchor': li === 0 ? 'start' : (li === labelCount - 1 ? 'end' : 'middle'),
        class: 'axis-label'
      });
      txt2.textContent = rows[idx].date.slice(2);
      xLabelsG.appendChild(txt2);
    }

    // candles + volume bars
    var candles = document.getElementById('candles');
    var volBars = document.getElementById('volumeBars');
    candles.innerHTML = ''; volBars.innerHTML = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var cx = x(i);
      var color = dirColorVar(r.open, r.close);

      candles.appendChild(el('line', {
        x1: cx, x2: cx, y1: yPrice(r.high), y2: yPrice(r.low),
        class: 'wick', style: 'stroke:' + color
      }));
      var bodyTop = yPrice(Math.max(r.open, r.close));
      var bodyH = Math.max(1, Math.abs(yPrice(r.open) - yPrice(r.close)));
      candles.appendChild(el('rect', {
        x: cx - bodyW / 2, y: bodyTop, width: bodyW, height: bodyH,
        style: 'fill:' + color
      }));

      var volH2 = volBottom - yVol(r.volume || 0);
      volBars.appendChild(el('rect', {
        x: cx - bodyW / 2, y: yVol(r.volume || 0), width: bodyW, height: Math.max(0.5, volH2),
        style: 'fill:' + color, opacity: 0.75
      }));
    }

    // last-close reference line
    var last = rows[rows.length - 1];
    var lcY = yPrice(last.close);
    var lcLine = document.getElementById('lastCloseLine');
    lcLine.setAttribute('x1', padL); lcLine.setAttribute('x2', W - padR);
    lcLine.setAttribute('y1', lcY); lcLine.setAttribute('y2', lcY);
    var lcLabel = document.getElementById('lastCloseLabel');
    lcLabel.setAttribute('x', W - padR); lcLabel.setAttribute('y', lcY - 4);
    lcLabel.setAttribute('text-anchor', 'end');
    lcLabel.textContent = fmt(last.close, 1);

    // hover interaction
    var catcher = document.getElementById('hoverCatcher');
    catcher.setAttribute('height', volBottom - priceTop);
    var crosshair = document.getElementById('crosshair');
    crosshair.setAttribute('y1', priceTop); crosshair.setAttribute('y2', volBottom);
    var hoverCol = document.getElementById('hoverCol');
    hoverCol.setAttribute('y', priceTop); hoverCol.setAttribute('height', volBottom - priceTop);
    var tooltip = document.getElementById('tooltip');
    var svg = document.getElementById('chart');

    function onMove(evt) {
      var rect = svg.getBoundingClientRect();
      var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      var relX = (clientX - rect.left) / rect.width * W;
      var idx = Math.floor((relX - padL) / slotW);
      idx = Math.max(0, Math.min(rows.length - 1, idx));
      var r = rows[idx];
      var px = x(idx);

      crosshair.setAttribute('x1', px); crosshair.setAttribute('x2', px);
      crosshair.style.opacity = 1;
      hoverCol.setAttribute('x', px - slotW / 2);
      hoverCol.setAttribute('width', slotW);
      hoverCol.style.opacity = 0.05;

      var tipLeft = (px / W) * rect.width;
      var tipTop = (priceTop / 300) * rect.height;
      tooltip.style.opacity = 1;
      tooltip.innerHTML =
        '<div class="t-date">' + r.date + '</div>' +
        '<div class="t-row"><span>開盤</span><span>' + fmt(r.open, 1) + '</span></div>' +
        '<div class="t-row"><span>最高</span><span>' + fmt(r.high, 1) + '</span></div>' +
        '<div class="t-row"><span>最低</span><span>' + fmt(r.low, 1) + '</span></div>' +
        '<div class="t-row"><span>收盤</span><span>' + fmt(r.close, 1) + '</span></div>' +
        '<div class="t-row"><span>漲跌幅</span><span>' + pct(r.changePct) + '</span></div>' +
        '<div class="t-row"><span>成交量</span><span>' + fmtInt(r.volume) + ' 張</span></div>' +
        '<div class="t-row"><span>總振幅</span><span>' + pct(r.totalAmp) + '</span></div>';
      tooltip.style.left = clampedTooltipLeft(tooltip, tipLeft, rect.width) + 'px';
      tooltip.style.top = tipTop + 'px';
    }
    function onLeave() {
      crosshair.style.opacity = 0;
      hoverCol.style.opacity = 0;
      tooltip.style.opacity = 0;
    }
    catcher.onmousemove = onMove;
    catcher.onmouseleave = onLeave;
    catcher.ontouchmove = function (e) { onMove(e); e.preventDefault(); };
    catcher.ontouchend = onLeave;
  }

  // ---- Intraday drill-down (click a table row -> that day's minute chart) ----

  var minuteCache = null; // Promise -> { 'yyyy-mm-dd': [{hhmm,open,high,low,close,volume}, ...] }

  function loadMinuteData() {
    if (minuteCache) return minuteCache;
    minuteCache = fetch('output/6547_minute.csv')
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) {
        function clean(s) { return s.replace(/^"|"$/g, ''); }
        var lines = text.trim().split(/\r?\n/);
        var headers = lines[0].split(',').map(clean);
        function ci(name) {
          var i = headers.indexOf(name);
          if (i === -1) throw new Error('找不到欄位: ' + name);
          return i;
        }
        var iDate = ci('日期'), iHHMM = ci('hhmm'), iOpen = ci('開盤價'),
            iHigh = ci('最高價'), iLow = ci('最低價'), iClose = ci('收盤價'), iVol = ci('成交量');
        var map = {};
        for (var i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          var p = lines[i].split(',').map(clean);
          var d = p[iDate];
          if (!map[d]) map[d] = [];
          map[d].push({
            hhmm: p[iHHMM],
            open: parseFloat(p[iOpen]), high: parseFloat(p[iHigh]),
            low: parseFloat(p[iLow]), close: parseFloat(p[iClose]),
            volume: parseFloat(p[iVol])
          });
        }
        for (var d2 in map) map[d2].sort(function (a, b) { return a.hhmm.localeCompare(b.hhmm); });
        return map;
      });
    return minuteCache;
  }

  function hhmmLabel(hhmm) { return hhmm.slice(0, 2) + ':' + hhmm.slice(2); }

  function renderDayChart(dayRows) {
    var wrap = document.getElementById('modalChartWrap');
    wrap.innerHTML = '<svg class="chart" id="dayChart" viewBox="0 0 560 220" preserveAspectRatio="none" role="img" aria-label="當日分鐘走勢圖"></svg><div class="tooltip" id="dayTooltip"></div>';
    var svg = document.getElementById('dayChart');
    var W = 560, H = 220, padL = 46, padR = 8, padT = 8, padB = 22;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var dayOpen = dayRows[0].open;
    var closes = dayRows.map(function (r) { return r.close; });
    var dayMax = Math.max.apply(null, closes), dayMin = Math.min.apply(null, closes);

    // Only draw a +-% level line if the day's price actually reached it -
    // don't stretch the chart to show thresholds that were never approached.
    var levels = [3, 2, 1, -1, -2, -3]
      .map(function (p) { return { pct: p, value: dayOpen * (1 + p / 100) }; })
      .filter(function (l) { return l.pct > 0 ? dayMax >= l.value : dayMin <= l.value; });

    var yMax = dayMax, yMin = dayMin;
    var pad = (yMax - yMin) * 0.12 || Math.max(0.5, yMax * 0.01);
    yMax += pad; yMin -= pad;

    function x(i) { return padL + (dayRows.length === 1 ? plotW / 2 : (i / (dayRows.length - 1)) * plotW); }
    function y(v) { return padT + (1 - (v - yMin) / (yMax - yMin)) * plotH; }

    var steps = 4;
    for (var s = 0; s <= steps; s++) {
      var v = yMin + (yMax - yMin) * (s / steps);
      var yy = y(v);
      svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: yy, y2: yy, class: 'gridline' }));
      var t = el('text', { x: padL - 8, y: yy + 3.5, 'text-anchor': 'end', class: 'axis-label' });
      t.textContent = v.toFixed(2);
      svg.appendChild(t);
    }
    svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: padT + plotH, y2: padT + plotH, class: 'baseline' }));

    var labelCount = Math.min(6, dayRows.length);
    for (var li = 0; li < labelCount; li++) {
      var idx = Math.round((li / Math.max(1, labelCount - 1)) * (dayRows.length - 1));
      var t2 = el('text', {
        x: x(idx), y: H - 6,
        'text-anchor': li === 0 ? 'start' : (li === labelCount - 1 ? 'end' : 'middle'),
        class: 'axis-label'
      });
      t2.textContent = hhmmLabel(dayRows[idx].hhmm);
      svg.appendChild(t2);
    }

    // +-1% / +-3% reference lines (from day's open) - red for +, green for -
    // (TW convention), only shown when the day's price actually reached them
    levels.forEach(function (l) {
      var yy = y(l.value);
      var dir = l.pct > 0 ? 'up' : 'down';
      svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: yy, y2: yy, class: 'level-line ' + dir }));
      var lbl = el('text', { x: W - padR, y: yy - 3, 'text-anchor': 'end', class: 'level-label ' + dir });
      lbl.textContent = (l.pct > 0 ? '+' : '') + l.pct + '%';
      svg.appendChild(lbl);
    });

    // open-price reference line
    var openY = y(dayOpen);
    svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: openY, y2: openY, class: 'last-close-line' }));

    var pts = dayRows.map(function (r, i) { return x(i) + ',' + y(r.close); });
    svg.appendChild(el('path', {
      d: 'M ' + pts.join(' L '), fill: 'none',
      style: 'stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round'
    }));

    var crosshair = el('line', { x1: padL, x2: padL, y1: padT, y2: padT + plotH, class: 'crosshair-x' });
    svg.appendChild(crosshair);
    var dot = el('circle', { r: 4, style: 'fill:var(--accent);stroke:var(--surface);stroke-width:2', opacity: 0 });
    svg.appendChild(dot);
    var catcher = el('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent' });
    svg.appendChild(catcher);

    var tooltip = document.getElementById('dayTooltip');
    function onMove(evt) {
      var rect = svg.getBoundingClientRect();
      var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      var relX = (clientX - rect.left) / rect.width * W;
      var idx2 = Math.round(((relX - padL) / plotW) * (dayRows.length - 1));
      idx2 = Math.max(0, Math.min(dayRows.length - 1, idx2));
      var r = dayRows[idx2], px = x(idx2), py = y(r.close);
      var dayOpen = dayRows[0].open;
      var ampFromOpen = dayOpen ? (r.close - dayOpen) / dayOpen * 100 : NaN;
      crosshair.setAttribute('x1', px); crosshair.setAttribute('x2', px); crosshair.style.opacity = 1;
      dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.style.opacity = 1;
      tooltip.style.opacity = 1;
      tooltip.innerHTML =
        '<div class="t-date">' + hhmmLabel(r.hhmm) + '</div>' +
        '<div class="t-row"><span>成交</span><span>' + fmt(r.close, 2) + '</span></div>' +
        '<div class="t-row"><span>成交量</span><span>' + fmtInt(r.volume) + ' 張</span></div>' +
        '<div class="t-row"><span>振幅(較開盤)</span><span>' + pct(ampFromOpen) + '</span></div>';
      tooltip.style.left = clampedTooltipLeft(tooltip, (px / W) * rect.width, rect.width) + 'px';
      tooltip.style.top = ((py / H) * rect.height) + 'px';
    }
    function onLeave() { crosshair.style.opacity = 0; dot.style.opacity = 0; tooltip.style.opacity = 0; }
    catcher.onmousemove = onMove;
    catcher.onmouseleave = onLeave;
    catcher.ontouchmove = function (e) { onMove(e); e.preventDefault(); };
    catcher.ontouchend = onLeave;
  }

  function openDayModal(date) {
    var backdrop = document.getElementById('modalBackdrop');
    document.getElementById('modalTitle').textContent = date + ' 分鐘走勢';
    var statsEl = document.getElementById('modalStats');
    statsEl.innerHTML = '<span>載入中…</span>';
    document.getElementById('modalChartWrap').innerHTML =
      '<svg class="chart" id="dayChart" viewBox="0 0 560 220" preserveAspectRatio="none"></svg><div class="tooltip" id="dayTooltip"></div>';
    backdrop.classList.add('open');

    loadMinuteData().then(function (map) {
      var dayRows = map[date];
      if (!dayRows || !dayRows.length) {
        document.getElementById('modalChartWrap').innerHTML =
          '<div class="modal-empty">output/6547_minute.csv 沒有 ' + date + ' 這天的分鐘資料(分鐘資料只涵蓋部分近期區間)</div>';
        statsEl.innerHTML = '';
        return;
      }
      var dOpen = dayRows[0].open;
      var dClose = dayRows[dayRows.length - 1].close;
      var dHigh = Math.max.apply(null, dayRows.map(function (r) { return r.high; }));
      var dLow = Math.min.apply(null, dayRows.map(function (r) { return r.low; }));
      var dVol = dayRows.reduce(function (s, r) { return s + (r.volume || 0); }, 0);
      var chg = dOpen ? (dClose - dOpen) / dOpen * 100 : NaN;
      statsEl.innerHTML =
        '<span>開盤 <b>' + fmt(dOpen, 2) + '</b></span>' +
        '<span>最高 <b>' + fmt(dHigh, 2) + '</b></span>' +
        '<span>最低 <b>' + fmt(dLow, 2) + '</b></span>' +
        '<span>收盤 <b>' + fmt(dClose, 2) + '</b></span>' +
        '<span class="' + signClass(chg) + '">漲跌 <b>' + pct(chg) + '</b></span>' +
        '<span>成交量 <b>' + fmtInt(dVol) + '</b> 張</span>';
      renderDayChart(dayRows);
    }).catch(function (err) {
      document.getElementById('modalChartWrap').innerHTML =
        '<div class="modal-empty">讀取 output/6547_minute.csv 失敗:' + err + '</div>';
      statsEl.innerHTML = '';
    });
  }

  function closeDayModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
  }

  function initModal() {
    document.getElementById('tableBody').addEventListener('click', function (e) {
      var tr = e.target.closest('tr');
      if (!tr) return;
      var date = tr.getAttribute('data-date');
      if (date) openDayModal(date);
    });
    document.getElementById('modalClose').addEventListener('click', closeDayModal);
    document.getElementById('modalBackdrop').addEventListener('click', function (e) {
      if (e.target.id === 'modalBackdrop') closeDayModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDayModal();
    });
  }

  function render() {
    var rows = filteredRows();
    if (!rows.length) return;
    document.getElementById('rangeHint').textContent =
      rows[0].date + ' 至 ' + rows[rows.length - 1].date + '(共 ' + rows.length + ' 個交易日)';
    renderStats(rows);
    renderChart(rows);
    renderTable(rows);
  }

  function initRangeButtons() {
    var container = document.getElementById('rangeButtons');
    var buttons = container.querySelectorAll('button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        btn.setAttribute('aria-pressed', 'true');
        state.rangeDays = parseInt(btn.getAttribute('data-range'), 10);
        render();
      });
    });
    buttons[0].setAttribute('aria-pressed', 'true');
  }

  fetch('output/6547_daily.csv')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (text) {
      state.rows = parseCSV(text);
      initRangeButtons();
      initModal();
      render();
      window.addEventListener('resize', render);
    })
    .catch(function (err) {
      document.getElementById('rangeHint').textContent = '資料載入失敗:' + err + '(需透過 http:// 伺服器開啟,例如 Live Server,不能直接雙擊開檔案)';
    });
})();
</script>
